services:
  mysql:
    image: arm64v8/mysql:8.4
    environment:
      - MYSQL_DATABASE=devtester
      - MYSQL_ROOT_PASSWORD=123456
      - TZ=Asia/Shanghai
    ports:
      - 2330:3306
    volumes:
      - ../certs:/certs
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
      - ../mysql/init-ssl.sh:/usr/local/bin/init-ssl.sh:ro
    entrypoint:
      - bash
      - /usr/local/bin/init-ssl.sh
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time_zone='+8:00'
    # User/Password: root/123456

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      - ORACLE_PASSWORD=123456
      - ORACLE_DATABASE=DEVTESTDB
      - APP_USER=devtester
      - APP_USER_PASSWORD=123456
    ports:
      - 2521:1521
      - 2484:2484
      - 2485:2485
    volumes:
      - ../oracle/init:/container-entrypoint-initdb.d:ro
      - ../oracle/startdb:/container-entrypoint-startdb.d:ro
      - ../oracle/wallet:/wallet:ro
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2g
    # SYS/SYSTEM Password: 123456
    # App User/Password: devtester/123456
    # PDB Service: DEVTESTDB
    # JDBC URL: jdbc:oracle:thin:@localhost:2521/DEVTESTDB

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - 2543:5432
    volumes:
      - ../certs:/certs
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../postgres/init-ssl.sh:/usr/local/bin/init-ssl.sh:ro
    entrypoint:
      - bash
      - /usr/local/bin/init-ssl.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    # User/Password: postgres/123456

  redis:
    image: redis:7.2.3
    privileged: true
    ports:
      - 2637:6379
    restart: always
    command: redis-server --requirepass 123456
    # Password: 123456

  mongo:
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=123456
    ports:
      - 2701:27017
    restart: always
    # User/Password: root/123456

  mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    platform: linux/amd64
    environment:
      - SA_PASSWORD=Share123456!
      - ACCEPT_EULA=Y
    ports:
      - 2143:1433
    volumes:
      - ../mssql/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["bash", "/entrypoint.sh"]
    # User/Password: sa/Share123456!

  db2:
    image: ibmcom/db2
    platform: linux/amd64
    environment:
      - DB2INST1_PASSWORD=123456
      - DBNAME=DEVTEST
      - LICENSE=accept
    ports:
      - 2500:50000
    privileged: true
    # User/Password: db2inst1/123456

  clickhouse:
    image: clickhouse/clickhouse-server
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=root
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - TZ=Asia/Shanghai
      - CLICKHOUSE_PASSWORD=password123
    ports:
      - 2812:8123
      - 2900:9000
    restart: always
    # User/Password: root/password123

  elasticsearch6:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - 2920:9200
      - 2930:9300
    restart: always

  elasticsearch7:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - 2921:9200
      - 2931:9300
    restart: always

  milvus:
    image: milvusdb/milvus:v2.6.2
    platform: linux/amd64
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - COMMON_STORAGETYPE=local
    ports:
      - 2953:19530
      - 2909:9091
    restart: always

  ssh_server:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - USER_NAME=sshuser
      - USER_PASSWORD=123456
      - PASSWORD_ACCESS=true
      - PUBLIC_KEY_FILE=/ssh-keys/authorized_keys
    volumes:
      - ../ssh:/ssh-keys:ro
      - ../ssh/10-enable-tcp-forwarding.sh:/custom-cont-init.d/10-enable-tcp-forwarding.sh:ro
    ports:
      - "2022:22"
    restart: always

  proxy:
    image: 3proxy/3proxy:latest
    platform: linux/amd64
    volumes:
      - ../proxy:/etc/3proxy:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 2312:3128
      - 2108:1080
    restart: always

  proxy_auth:
    image: 3proxy/3proxy:latest
    platform: linux/amd64
    volumes:
      - ../proxy-auth:/etc/3proxy:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 2313:3128
      - 2109:1080
    restart: always
