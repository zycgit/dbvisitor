plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'dbVisitor Test Framework'
description = 'TCK for dbVisitor.'

dependencies {
    api project(':dbvisitor')
    api project(':dbvisitor-driver')

    testImplementation project(':jdbc-redis')
    testImplementation project(':jdbc-mongo')
    testImplementation project(':jdbc-elastic')
    testImplementation project(':jdbc-milvus')
    testImplementation 'io.minio:minio:8.5.7'
    testImplementation 'ch.qos.logback:logback-classic:1.2.11'
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'mysql:mysql-connector-java:8.0.33'
    testImplementation 'org.postgresql:postgresql:42.6.0'
    testImplementation 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre8'
    testImplementation 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'
    testImplementation 'com.ibm.db2:jcc:11.5.9.0'
    testImplementation 'com.clickhouse:clickhouse-jdbc:0.6.3'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
    testImplementation 'org.lz4:lz4-java:1.8.0'
    testImplementation 'com.zaxxer:HikariCP:4.0.3'
    testImplementation 'ognl:ognl:3.4.2'
    testImplementation 'com.google.protobuf:protobuf-java:3.25.5'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation "org.antlr:antlr4-runtime:${property('lib.antlr')}"
}

test {
    if (findProperty('nxn.env')) {
        def nxnEnv = findProperty('nxn.env').toString()
        def environments = ['h2', 'mysql', 'pg', 'mssql', 'oracle', 'db2', 'clickhouse', 'redis', 'mongo', 'es6', 'es7', 'milvus']
        if (!environments.contains(nxnEnv)) {
            throw new GradleException("Unknown nxn.env: ${nxnEnv}")
        }

        def realdbPackage = nxnEnv == 'es6' ? 'elastic6' : nxnEnv == 'es7' ? 'elastic7' : nxnEnv
        def resultDir = layout.buildDirectory.dir("nxn/${nxnEnv}").get().asFile
        def runId = UUID.randomUUID().toString()
        systemProperty 'nxn.env', nxnEnv
        systemProperty 'nxn.resultDir', resultDir.absolutePath
        systemProperty 'nxn.runId', runId
        include "**/realdb/${realdbPackage}/**/*Test.class"
        reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/nxn/${nxnEnv}")
        reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/nxn/${nxnEnv}")
        // A documentation update must use a new execution, never an earlier filtered run.
        outputs.upToDateWhen { false }
        doFirst {
            delete resultDir
            resultDir.mkdirs()
        }

        afterSuite { descriptor, result ->
            if (descriptor.parent == null) {
                def summary = [runId   : runId, env: nxnEnv, tests: result.testCount,
                               failed  : result.failedTestCount, skipped: result.skippedTestCount,
                               filtered: !filter.commandLineIncludePatterns.empty,
                               complete: result.resultType != TestResult.ResultType.FAILURE && result.testCount > 0]
                new File(resultDir, 'run.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(summary)) + '\n'
            }
        }
    } else {
        include '**/unit/**/*Test.class'
    }
}

tasks.register('checkNxnMapping', JavaExec) {
    group = 'verification'
    description = 'Check contract annotations against the documentation compatibility JSON.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hasor.dbvisitor.test.nxn.report.NxnDocumentation'
    args 'check', rootProject.file('dbvisitor-doc/src/data/capabilities').absolutePath
}

tasks.register('updateNxnDocs', JavaExec) {
    group = 'verification'
    description = 'Run one datasource suite and update its compatibility JSON results.'
    dependsOn tasks.named('checkNxnMapping'), tasks.named('test')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hasor.dbvisitor.test.nxn.report.NxnDocumentation'
    doFirst {
        def nxnEnv = project.findProperty('nxn.env')
        if (!nxnEnv) {
            throw new GradleException('Use -Pnxn.env=<datasource> to update compatibility results.')
        }

        def resultDir = layout.buildDirectory.dir("nxn/${nxnEnv}").get().asFile
        def summaryFile = new File(resultDir, 'run.json')
        def expectedRunId = tasks.named('test').get().systemProperties['nxn.runId']
        if (!summaryFile.isFile() || new groovy.json.JsonSlurper().parse(summaryFile).runId != expectedRunId) {
            throw new GradleException('No fresh NxN test run; do not skip the test task when updating documentation.')
        }

        args 'update', rootProject.file('dbvisitor-doc/src/data/capabilities').absolutePath, nxnEnv, resultDir.absolutePath
    }
}
