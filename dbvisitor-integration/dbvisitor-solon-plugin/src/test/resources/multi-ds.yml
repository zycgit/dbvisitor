solon.dataSources:
  one:
    class: "com.zaxxer.hikari.HikariDataSource"
    jdbcUrl: "jdbc:h2:mem:solon_multi;MODE=MySQL;DB_CLOSE_DELAY=-1;USER=sa"
  two:
    class: "com.zaxxer.hikari.HikariDataSource"
    jdbcUrl: "jdbc:h2:mem:solon_multi;MODE=MySQL;DB_CLOSE_DELAY=-1;USER=sa"
  three:
    class: "com.zaxxer.hikari.HikariDataSource"
    jdbcUrl: "jdbc:h2:mem:solon_multi;MODE=MySQL;DB_CLOSE_DELAY=-1;USER=sa"

dbvisitor:
  one:
    mapperLocations: classpath:dbvisitor/mapper/role/*.xml
    mapperPackages: net.hasor.dbvisitor.test.dao.role
  two:
    mapperLocations: classpath:dbvisitor/mapper/user/*.xml
    mapperPackages: net.hasor.dbvisitor.test.dao.user
  three:
    mapperDisabled: true
