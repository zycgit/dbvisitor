<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">A cache is not the source of truth.</title><desc id="desc">Look up the cache first; on a miss load the business database and save JSON with a TTL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#475569}</style><rect width="1080" height="380" rx="20" fill="#f8fafc"/><rect x="28" y="142" width="190" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="123" y="179" text-anchor="middle" class="label">Request</text><text x="123" y="209" text-anchor="middle" class="small">product ID</text><path d="M218 190 L267 190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="274" y="142" width="205" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="376.5" y="179" text-anchor="middle" class="label">GET key</text><text x="376.5" y="209" text-anchor="middle" class="small">JSON to Product</text><path d="M479 190 L545 112" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M479 190 L545 268" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="552" y="64" width="260" height="96" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="682" y="101" text-anchor="middle" class="label">Cache hit</text><text x="682" y="131" text-anchor="middle" class="small">Return Product</text><rect x="552" y="220" width="260" height="96" rx="16" fill="#fff7ed" stroke="#cbd5e1"/><text x="682" y="257" text-anchor="middle" class="label">Cache miss</text><text x="682" y="287" text-anchor="middle" class="small">Read business DB</text><path d="M812 268 L857 268" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="864" y="220" width="190" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="959" y="257" text-anchor="middle" class="label">SET ... EX</text><text x="959" y="287" text-anchor="middle" class="small">Save with TTL</text><text x="527" y="341" class="small">Product updated? Invalidate the cached value.</text></svg>
