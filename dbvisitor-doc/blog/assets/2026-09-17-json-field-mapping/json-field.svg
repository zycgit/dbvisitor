<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc"><title id="title">One property maps to one column.</title><desc id="desc">The type handler serializes a Preferences object to JSON text and reconstructs it when reading.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#475569}</style><rect width="1080" height="340" rx="20" fill="#f8fafc"/><rect x="28" y="112" width="265" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="160.5" y="149" text-anchor="middle" class="label">Preferences</text><text x="160.5" y="179" text-anchor="middle" class="small">theme + channels</text><path d="M293 160 L343 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="112" width="350" height="96" rx="16" fill="#fff7ed" stroke="#cbd5e1"/><text x="525" y="149" text-anchor="middle" class="label">One database column</text><text x="525" y="179" text-anchor="middle" class="small">JSON text in VARCHAR(2000)</text><path d="M700 160 L750 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="757" y="112" width="295" height="96" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="904.5" y="149" text-anchor="middle" class="label">Preferences</text><text x="904.5" y="179" text-anchor="middle" class="small">Read back as an object</text><text x="540" y="282" text-anchor="middle" class="label">Explicit mapping. No automatic table relationships.</text></svg>
