<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc"><title id="title">一个对象，保存到一个字段</title><desc id="desc">The type handler serializes a Preferences object to JSON text and reconstructs it when reading.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#475569}</style><rect width="1080" height="340" rx="20" fill="#f8fafc"/><rect x="28" y="112" width="265" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="160.5" y="149" text-anchor="middle" class="label">Preferences</text><text x="160.5" y="179" text-anchor="middle" class="small">主题与通知渠道</text><path d="M293 160 L343 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="112" width="350" height="96" rx="16" fill="#fff7ed" stroke="#cbd5e1"/><text x="525" y="149" text-anchor="middle" class="label">一个数据库字段</text><text x="525" y="179" text-anchor="middle" class="small">VARCHAR 中的 JSON 文本</text><path d="M700 160 L750 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="757" y="112" width="295" height="96" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="904.5" y="149" text-anchor="middle" class="label">Preferences</text><text x="904.5" y="179" text-anchor="middle" class="small">读取后还原为对象</text><text x="540" y="282" text-anchor="middle" class="label">显式配置映射，不自动创建表关系。</text></svg>
