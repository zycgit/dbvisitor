<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc"><title id="title">One entity. Familiar Java access.</title><desc id="desc">Entity fields map to collection fields. Builders and annotated methods share the JDBC driver.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#475569}</style><rect width="1080" height="360" rx="20" fill="#f8fafc"/><rect x="35" y="142" width="235" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="152.5" y="179" text-anchor="middle" class="label">Article entity</text><text x="152.5" y="209" text-anchor="middle" class="small">id / title / embedding</text><path d="M270 190 L345 126" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 190 L345 264" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="78" width="305" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="502.5" y="115" text-anchor="middle" class="label">Builder API</text><text x="502.5" y="145" text-anchor="middle" class="small">Conditions + orderByL2</text><rect x="350" y="216" width="305" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="502.5" y="253" text-anchor="middle" class="label">Mapper annotation</text><text x="502.5" y="283" text-anchor="middle" class="small">SQL + named parameters</text><path d="M655 126 L738 190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 264 L738 190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="745" y="142" width="300" height="96" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="895" y="179" text-anchor="middle" class="label">Milvus collection</text><text x="895" y="209" text-anchor="middle" class="small">Same fields, same vectors</text></svg>
