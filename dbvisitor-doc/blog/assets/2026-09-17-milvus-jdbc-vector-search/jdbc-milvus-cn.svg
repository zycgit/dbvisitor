<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc"><title id="title">写 SQL，读取向量检索结果</title><desc id="desc">JDBC sends SQL and parameters to jdbc-milvus, which calls the Milvus SDK; results return as ResultSet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#475569}</style><rect width="1080" height="340" rx="20" fill="#f8fafc"/><rect x="32" y="112" width="220" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="142" y="149" text-anchor="middle" class="label">Java 业务代码</text><text x="142" y="179" text-anchor="middle" class="small">PreparedStatement</text><path d="M252 160 L294 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="112" width="220" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="410" y="149" text-anchor="middle" class="label">jdbc-milvus</text><text x="410" y="179" text-anchor="middle" class="small">SQL 与绑定参数</text><path d="M520 160 L562 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="568" y="112" width="210" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="673" y="149" text-anchor="middle" class="label">官方 SDK</text><text x="673" y="179" text-anchor="middle" class="small">Search / Query</text><path d="M778 160 L816 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="822" y="112" width="225" height="96" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="934.5" y="149" text-anchor="middle" class="label">Milvus</text><text x="934.5" y="179" text-anchor="middle" class="small">执行向量检索</text><text x="540" y="284" text-anchor="middle" class="label">通过 ResultSet 读取结果</text></svg>
