<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="372" viewBox="0 0 1080 372" role="img" aria-labelledby="title desc"><title id="title">Two retrieval paths. One ranked result.</title><desc id="desc">The shared category filter applies to dense and BM25 retrieval. RRF fuses candidate ranks on the server.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#475569}</style><rect width="1080" height="372" rx="20" fill="#f8fafc"/><rect x="30" y="146" width="220" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="140" y="183" text-anchor="middle" class="label">Search request</text><text x="140" y="213" text-anchor="middle" class="small">category + query</text><path d="M250 194 L309 118" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 194 L309 272" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="70" width="280" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="455" y="107" text-anchor="middle" class="label">Dense search</text><text x="455" y="137" text-anchor="middle" class="small">vector + candidate LIMIT</text><rect x="315" y="224" width="280" height="96" rx="16" fill="#fff7ed" stroke="#cbd5e1"/><text x="455" y="261" text-anchor="middle" class="label">BM25 search</text><text x="455" y="291" text-anchor="middle" class="small">text + candidate LIMIT</text><path d="M595 118 L647 194" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M595 272 L647 194" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="654" y="146" width="170" height="96" rx="16" fill="#eff6ff" stroke="#cbd5e1"/><text x="739" y="183" text-anchor="middle" class="label">RRF</text><text x="739" y="213" text-anchor="middle" class="small">Rank fusion</text><path d="M824 194 L858 194" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="865" y="146" width="185" height="96" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="957.5" y="183" text-anchor="middle" class="label">ResultSet</text><text x="957.5" y="213" text-anchor="middle" class="small">Final LIMIT</text></svg>
