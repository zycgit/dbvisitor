import groovy.json.JsonSlurper

plugins {
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

def pomMetadata = new JsonSlurper().parse(file('pom.json'))

allprojects {
    group = 'net.hasor'
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(17)
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 17
        }
        tasks.withType(Javadoc).configureEach {
            options.encoding = 'UTF-8'
            options.addStringOption('Xdoclint:none', '-quiet')
            failOnError = false
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.io=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.net=ALL-UNNAMED'
        }
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }
        dependencies {
            testImplementation platform("org.junit:junit-bom:${property('lib.junit')}")
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testImplementation 'org.junit.platform:junit-platform-launcher'
        }

        apply plugin: 'jacoco'
        jacoco {
            toolVersion = property('lib.jacoco')
        }
        tasks.named('test') {
            finalizedBy tasks.named('jacocoTestReport')
        }
        tasks.named('jacocoTestReport') {
            dependsOn tasks.named('test')
            reports {
                xml.required = true
                html.required = true
            }
        }
        tasks.named('jacocoTestCoverageVerification') {
            dependsOn tasks.named('test')
        }
        tasks.named('check') {
            dependsOn tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')
        }

        plugins.withId('maven-publish') {
            apply plugin: 'signing'
            java {
                withSourcesJar()
                withJavadocJar()
            }
            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        from components.java
                        pom {
                            name = providers.provider { project.findProperty('pomName') ?: project.name }
                            description = providers.provider { project.description ?: project.name }
                            url = pomMetadata.url
                            licenses {
                                pomMetadata.licenses.each { licenseMetadata ->
                                    license {
                                        name = licenseMetadata.name
                                        url = licenseMetadata.url
                                    }
                                }
                            }
                            developers {
                                pomMetadata.developers.each { developerMetadata ->
                                    developer {
                                        name = developerMetadata.name
                                        email = developerMetadata.email
                                    }
                                }
                            }
                            scm {
                                connection = pomMetadata.scm.connection
                                developerConnection = pomMetadata.scm.developerConnection
                                url = pomMetadata.scm.url
                                tag = pomMetadata.scm.tag
                            }
                        }
                    }
                }
                if (findProperty('centralBundleDir')) {
                    repositories {
                        maven {
                            name = 'centralBundle'
                            url = uri(findProperty('centralBundleDir'))
                        }
                    }
                }
            }
            plugins.withId('com.gradleup.shadow') {
                def publication = publishing.publications.mavenJava
                publication.setArtifacts([])
                publication.artifact(tasks.named('shadowJar')) {
                    classifier = null
                }
                publication.artifact(tasks.named('sourcesJar'))
                publication.artifact(tasks.named('javadocJar'))
            }
            signing {
                required { findProperty('centralRelease') == 'true' }
                def key = findProperty('maven.central.signing_key')
                if (key) {
                    useInMemoryPgpKeys(key.replace('\\n', '\n'), findProperty('maven.central.signing_password'))
                }
                sign publishing.publications.mavenJava
            }
        }
    }
}
