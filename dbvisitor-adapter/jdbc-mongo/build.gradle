plugins {
    id 'java-library'
    id 'maven-publish'
    id 'antlr'
    id 'com.gradleup.shadow'
}

ext.pomName = 'dbVisitor Adapter of MongoDB'
description = 'JDBC driver adapter for MongoDB.'

configurations {
    shaded
}

dependencies {
    api project(':dbvisitor-driver')
    api 'org.mongodb:mongodb-driver-sync:5.6.1'

    antlr "org.antlr:antlr4:${property('lib.antlr')}"
    compileOnly "org.antlr:antlr4-runtime:${property('lib.antlr')}"
    shaded "org.antlr:antlr4-runtime:${property('lib.antlr')}"
    testImplementation "org.antlr:antlr4-runtime:${property('lib.antlr')}"
    testImplementation "org.mockito:mockito-core:${property('lib.mockito')}"
}

tasks.named('generateGrammarSource') {
    arguments += ['-visitor', '-package', 'net.hasor.dbvisitor.adapter.mongo.parser']
    outputDirectory = layout.buildDirectory.dir('generated-src/antlr/main/net/hasor/dbvisitor/adapter/mongo/parser').get().asFile
}

apply from: rootProject.file('dbvisitor-adapter/jdbc.gradle')

tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {
    relocate 'org.antlr', 'net.hasor.dbvisitor.adapter.mongo.internal.jars.antlr'
}
