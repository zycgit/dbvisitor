plugins {
    id 'java-library'
    id 'maven-publish'
    id 'antlr'
    id 'com.gradleup.shadow'
}

ext.pomName = 'dbVisitor Adapter of Elastic'
description = 'JDBC driver adapter for Elastic.'

configurations {
    shaded
}

dependencies {
    api project(':dbvisitor-driver')
    api 'org.elasticsearch.client:elasticsearch-rest-client:7.17.10'
    shaded 'com.fasterxml.jackson.core:jackson-databind:2.18.0'

    antlr "org.antlr:antlr4:${property('lib.antlr')}"
    compileOnly "org.antlr:antlr4-runtime:${property('lib.antlr')}"
    shaded "org.antlr:antlr4-runtime:${property('lib.antlr')}"
    testImplementation "org.antlr:antlr4-runtime:${property('lib.antlr')}"
    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
    testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
}

tasks.named('generateGrammarSource') {
    arguments += ['-visitor', '-package', 'net.hasor.dbvisitor.adapter.elastic.parser']
    outputDirectory = layout.buildDirectory.dir('generated-src/antlr/main/net/hasor/dbvisitor/adapter/elastic/parser').get().asFile
}

apply from: rootProject.file('dbvisitor-adapter/jdbc.gradle')

tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {
    relocate 'org.antlr', 'net.hasor.dbvisitor.adapter.elastic.internal.jars.antlr'
    relocate 'com.fasterxml', 'net.hasor.dbvisitor.adapter.elastic.internal.jars.fasterxml'
}
