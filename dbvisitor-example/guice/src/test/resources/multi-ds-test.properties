dbvisitor.multiple-datasource=one,two,three

# RoleMapper
dbvisitor.one.jdbc-ds=com.zaxxer.hikari.HikariDataSource
dbvisitor.one.jdbc-ds.jdbc-url=jdbc:h2:mem:guice_multi;MODE=MySQL;DB_CLOSE_DELAY=-1
dbvisitor.one.jdbc-ds.username=sa
dbvisitor.one.jdbc-ds.password=
dbvisitor.one.mapper-locations=classpath:dbvisitor/mapper/role/*.xml
dbvisitor.one.mapper-packages=com.example.demo.dao.role

# UserMapper
dbvisitor.two.jdbc-ds=com.zaxxer.hikari.HikariDataSource
dbvisitor.two.jdbc-ds.jdbc-url=jdbc:h2:mem:guice_multi;MODE=MySQL;DB_CLOSE_DELAY=-1
dbvisitor.two.jdbc-ds.username=sa
dbvisitor.two.jdbc-ds.password=
dbvisitor.two.mapper-locations=classpath:dbvisitor/mapper/user/*.xml
dbvisitor.two.mapper-packages=com.example.demo.dao.user

# Session
dbvisitor.three.jdbc-ds=com.zaxxer.hikari.HikariDataSource
dbvisitor.three.jdbc-ds.jdbc-url=jdbc:h2:mem:guice_multi;MODE=MySQL;DB_CLOSE_DELAY=-1
dbvisitor.three.jdbc-ds.username=sa
dbvisitor.three.jdbc-ds.password=
dbvisitor.three.mapper-disabled=true
